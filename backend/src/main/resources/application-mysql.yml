spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    # 连接信息由 IDEA 或部署环境注入；仅端口提供通用默认值。
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
argus:
  redis:
    enabled: ${ARGUS_REDIS_ENABLED:false}
  messaging:
    enabled: ${ARGUS_MQ_ENABLED:false}
  identity:
    test-data:
      enabled: ${ARGUS_IDENTITY_TEST_DATA_ENABLED:false}
  security:
    # MySQL profile 默认 fail-closed；只有明确关闭才允许本地调试写接口。
    read-only: ${ARGUS_API_READ_ONLY:true}
  # 连接真实 MySQL 时不自动插入演示节点、实例和日志。
  demo-data:
    enabled: ${ARGUS_DEMO_DATA_ENABLED:false}

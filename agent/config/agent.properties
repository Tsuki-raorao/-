# Copy to a deployment directory and adjust values. Environment variables override these keys.
server.port=8090
node.id=node-local
node.name=local-node
node.advertised-host=127.0.0.1
auth.token=
executor.mock=true
docker.executable=docker
executor.timeout-seconds=30
# 并发任务上限和请求体限制，防止突发请求耗尽 Agent 线程或内存。
executor.max-concurrent-tasks=4
server.max-request-bytes=65536
server.max-http-threads=16
instance.id=mc01
instance.container=mc01
instance.discovery=false

# Argus 独立 IP 预览模板；在 nginx http 上下文 include，只安装本文件或 argus.conf.example 其中一份。
# 9090、TEST-NET 地址及 root 都是示例，先核对现场。已有 80 站点按原端口更新，不能盲目迁移。
# 不监听或重定向 443，不覆盖已有聊天服务；备案完成后的域名和 HTTPS 路由另行评审。

# 仅成功的构建指纹资源长期缓存；首页、API 和错误响应一律不存储。
map "$status:$uri" $argus_cache_control {
    default "no-store";
    ~^(200|304):/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 9090;
    listen [::]:9090;
    server_name 192.0.2.10;

    # 指向 dist 内容所在目录；不是仓库根，也不是 frontend 源码目录。
    root /srv/argus/frontend;
    index index.html;
    expires off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $argus_cache_control always;

    location = /index.html {
        try_files $uri =404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
    }
    location = /logo.png {
        try_files $uri =404;
    }
    location = /weixu-niang.png {
        try_files $uri =404;
    }
    location = /api {
        return 404;
    }
    # 更新已有 80 站点时，保留原 ACME webroot/alias；只暴露已存在的挑战文件。
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }
    location ~ /\. {
        return 404;
    }
    # 当前前端使用 hash 路由；不存在的文件不回退为 200 HTML。
    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9091;
        proxy_http_version 1.1;
        # $http_host 保留浏览器入口端口；$host 会丢失非标准端口。
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";

        # 本模板适用于直接面对浏览器的单层 Nginx。
        # 后端仅绑定回环且开启 framework 转发处理；覆盖客户端提供的信任头。
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Url-Scheme "";

        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
